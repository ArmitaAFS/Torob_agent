services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TOROB_DB_PATH: /app/runtime/torob.db
      CORS_ORIGINS: http://localhost:3000,*
    ports: ["8000:8000"]
    volumes: ["backend-data:/app/runtime"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  backend-data:
